name: collect

# 일 1회 자동 수집 + 수동/관리자 콘솔 트리거(workflow_dispatch).
# scripts/collect.ts 실행 → data/app.db 변경분만 deploy/github-pages 에 커밋·푸시
# → DB 변경 시 deploy.yml(GitHub Pages 정적 배포)을 명시적으로 workflow_dispatch 한다.
#   (빌트인 GITHUB_TOKEN 의 push 이벤트는 다른 워크플로를 트리거하지 못하므로 —
#    재귀 방지 정책 — push 트리거에 기대지 않고 직접 dispatch 한다. dispatch 는 예외로 동작.)
# 관리자 콘솔(src/lib/github.ts)이 정확히 이 파일명("collect.yml")으로 dispatch 한다.
#
# 06:00 KST 발행 트리거:
#   - 주: 외부 크론(cron-job.org 등)이 06:00 KST 에 이 워크플로를 workflow_dispatch 한다
#     (설정: README "발행 트리거(외부 크론)"). GitHub schedule 은 2026-08 말부터 예정보다
#     2~8시간 늦게 시작해 아침 발행을 맞추지 못한다 — cron 을 앞당겨도 시작 시각이 그대로였다
#     (04:17 예정 → 08:04~08:44 시작). workflow_dispatch 는 수 초 안에 시작한다.
#   - 백업: 아래 schedule. 외부 트리거가 실패한 날에만 수집하고, 이미 발행된 날은 guard 잡이 건너뛴다.

on:
  schedule:
    # 백업 트리거. schedule 은 늦어질 뿐 일찍 시작하지 않으므로 외부 트리거(06:00) 뒤에 두어
    # 순서가 뒤집히지 않게 한다. 정시(:00)는 스케줄러 혼잡이 더 심해 피한다.
    - cron: "47 21 * * *" # 21:47 UTC = 06:47 KST 매일 1회
  workflow_dispatch: {} # 외부 크론(정시 발행) + 관리자 콘솔 "재수집" + 수동 실행

# 동시에 두 실행이 app.db 를 쓰지 않도록 직렬화(취소하지 않고 대기).
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write # data/app.db 커밋/푸시 (빌트인 GITHUB_TOKEN 사용, 별도 PAT 불필요)
  actions: write # deploy.yml 을 workflow_dispatch 로 트리거

jobs:
  # 백업 schedule 실행이 이미 발행된 호를 다시 만들지 않게 막는다. 하루 2회 수집되면 LLM 비용이
  # 2배가 되고 호수(성공 실행 수, src/lib/db.ts)가 하루에 2씩 오른다.
  # workflow_dispatch(외부 크론·관리자 "재수집"·수동)는 항상 수집한다.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          ref: deploy/github-pages
          sparse-checkout: data/app.db
          sparse-checkout-cone-mode: false

      - name: Skip schedule run if already published
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          WINDOW_HOURS: "12" # 외부 트리거(06:00) 뒤 schedule 이 최대 ~8h 밀려도 이 안에 든다
        run: |
          # 트리거를 남긴다(schedule 이면 cron 식) — 지연·누락 진단용.
          echo "trigger: ${EVENT} ${CRON}"
          if [ "${EVENT}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import os, sqlite3
          db = sqlite3.connect("file:data/app.db?mode=ro", uri=True)
          last, hours = db.execute(
              "SELECT MAX(started_at), (julianday('now') - julianday(MAX(started_at))) * 24"
              " FROM collection_runs WHERE status != 'failed'"
          ).fetchone()
          skip = hours is not None and hours < float(os.environ["WINDOW_HOURS"])
          print(f"last run: {last} ({hours:.1f}h ago)" if hours is not None else "last run: none")
          print("skip — already published" if skip else "collect")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          PY

  collect:
    needs: guard
    # guard 가 실패해도(skip 출력 없음) 수집은 돈다 — 백업이 하루를 건너뛰는 것보다 낫다.
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # LLM 은 Message Batches API(50% 할인)로 보낸다. 선별·가공 두 배치가 각각 최대
    # BATCH_TIMEOUT_MIN(기본 25분)까지 기다린 뒤 일반 호출로 대체되므로 넉넉히 둔다.
    timeout-minutes: 75
    env:
      # 수집·LLM 가공에 필요한 비밀은 이 잡의 env 로만 주입(로그 echo 금지).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      # GitHub Search 레이트리밋 완화용(선택). GITHUB_ 접두 시크릿명은 금지되므로
      # GH_SEARCH_PAT 시크릿을 GITHUB_PAT 환경변수에 매핑한다.
      GITHUB_PAT: ${{ secrets.GH_SEARCH_PAT }}
      # 아래 vars 는 미설정 시 빈 문자열 → 코드 기본값(scripts/collect.ts)을 쓴다.
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      MAX_PICKS_PER_RUN: ${{ vars.MAX_PICKS_PER_RUN }} # 기본 30
      TRIAGE_POOL_SIZE: ${{ vars.TRIAGE_POOL_SIZE }} # 기본 150
      MAX_COST_USD_PER_RUN: ${{ vars.MAX_COST_USD_PER_RUN }} # 기본 0.1
      LLM_USE_BATCH: ${{ vars.LLM_USE_BATCH }} # 기본 true
      BATCH_TIMEOUT_MIN: ${{ vars.BATCH_TIMEOUT_MIN }} # 기본 25
    steps:
      # 배포 트리거 브랜치로 고정 정렬. schedule 실행은 기본 브랜치 컨텍스트로 돌므로
      # deploy/github-pages 를 명시 checkout 해 동일 브랜치에 커밋·push 한다.
      - uses: actions/checkout@v4
        with:
          ref: deploy/github-pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run collect (record exit code, never fail here)
        id: collect
        # collect.ts 는 status=failed 일 때만 exit 1. 실패해도 run 행은 이미
        # finally 에서 기록되므로, 여기서 잡을 죽이지 않고 DB 를 커밋해 /admin 에 노출한다.
        run: |
          set +e
          npm run collect
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit & push DB if changed
        id: commit
        # 배포 트리거 브랜치 고정. DB 변경 시 changed=true 를 출력해 다음 스텝이 배포를 dispatch.
        env:
          DEPLOY_BRANCH: deploy/github-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/app.db; then
            echo "no DB change — nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add data/app.db
          git commit -m "chore(data): daily collect $(date -u +%Y-%m-%d)"
          # 푸시 경쟁(다른 커밋이 먼저 들어온 경우) 대비 rebase 후 재시도.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${DEPLOY_BRANCH}" \
              && git push origin "HEAD:${DEPLOY_BRANCH}" \
              && break
            echo "push attempt $i failed — retrying"
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        # GITHUB_TOKEN push 는 워크플로를 트리거하지 못하므로 deploy.yml 을 명시적으로 dispatch.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref deploy/github-pages

      - name: Reflect pipeline health in run status
        # 잡 배지를 파이프라인 건강도(성공률 KPI)에 맞춘다. DB 커밋은 이미 끝났다.
        if: always()
        run: exit ${{ steps.collect.outputs.code || 0 }}
