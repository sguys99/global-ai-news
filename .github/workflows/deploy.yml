name: deploy

# 정적 export(`output:'export'`, out/) → GitHub Pages 배포.
# 트리거: deploy/github-pages 브랜치에 배포 산출에 영향 주는 파일이 push 되면 자동 실행
#         (collect.yml의 data/app.db 커밋이 이 워크플로를 트리거한다 — [skip ci] 제거됨).
#         + 수동 재배포(workflow_dispatch).
# 저장소 Settings → Pages → Source = "GitHub Actions" 로 설정해야 동작한다.

on:
  push:
    branches: [deploy/github-pages]
    paths:
      - "data/app.db" # 일 1회 수집 결과 — 콘텐츠 갱신의 주 트리거
      - "configs/**" # 소스/프롬프트 변경
      - "src/**" # 페이지/컴포넌트 변경
      - "scripts/**" # prebuild 색인 생성·산출물 크기 검사(size-report)
      - "public/**" # 정적 자산(out/ 에 그대로 복사)
      - "next.config.ts" # basePath/export 설정 변경
      - "package.json" # 의존성/스크립트 변경
      - ".github/workflows/deploy.yml" # 배포 파이프라인 자체 변경
  workflow_dispatch: {} # 즉시 재배포

# GitHub Pages 배포에 필요한 권한.
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포를 직렬화한다(최신 배포만 유효 → 진행 중 배포 취소).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # IndexNow 요청 본문(한 줄 JSON, 꺼져 있으면 빈 값) — deploy 잡이 배포 뒤 보낸다.
      indexnow: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 정적 export. prebuild가 build 직전 자동 실행된다:
      #   ① initDb --existing — 체크아웃한 data/app.db에 신규 컬럼(sources.format 등)·configs/sources.json 동기화를
      #      반영한다(러너 사본만 바뀌고 커밋하지 않음. 이미 맞으면 쓰지 않음, DB 파일이 없으면 실패).
      #   ② export-search-index · export-feed-index · export-latest — public/search-index/·feed-index/(언어별 호 월 조각 +
      #      manifest.json, Phase 4-2)·latest.json 생성 → next build가 out/ 산출.
      # postbuild(scripts/postbuild.ts)가 next build 직후 자동 실행된다: 기사 RSC(article/<id>/index.txt)를 지운다
      #   (기사 링크는 일반 <a> — ArticleLink). out/ 이 없으면 실패해 업로드 전에 멈춘다.
      - name: Build static export
        run: npm run build

      # 산출물 크기 검사(english-version-plan Phase 4-1, scripts/size-report.ts). GitHub Pages 사이트 한도는 1GB다.
      #   out/ 전체가 700MB 이상이면 ::warning::, 950MB 이상이면 ::error:: 와 함께 실패해 업로드 전에 멈춘다.
      #   기사 1쪽(HTML+RSC) 평균 40KB·호 1쪽 평균 150KB 예산을 넘으면 경고만 낸다(배포는 계속).
      #   분류별 크기·페이지 평균/p90·1GB 까지 남은 여유를 잡 요약($GITHUB_STEP_SUMMARY)에 붙인다.
      - name: Check output size
        run: npm run --silent size:report -- out --ci

      # 영어판 한글 누출 검사(english-version-plan Phase 5-4, scripts/en-hangul-check.ts).
      #   out/en/** 의 HTML·RSC(.txt)와 out/{search,feed}-index/en/** 색인에서 한글을 찾는다. 허용은 lang="ko" 요소 안뿐
      #   (한국 매체 원제 줄·`한국어` 전환 링크 — RSC 는 lang="ko" 호스트 요소의 props). 위반이 있거나 영어 파일이
      #   0개면 ::error:: 와 함께 실패해 업로드 전에 멈춘다. 검사 수·위반 수를 잡 요약에 붙인다.
      - name: Check English pages for Hangul
        run: npm run --silent en:hangul-check -- out --ci

      # SEO 정합성 검사(english-version-plan Phase 6-3, scripts/seo-check.ts). out/ 의 모든 페이지(보관 지면 포함, 404 제외)의
      #   canonical = 자기 주소 = og:url, <html lang> = 경로 언어 = og:locale, hreflang ko·en·x-default 상호 참조, og:image·RSS
      #   파일 존재, JSON-LD(NewsArticle·WebSite 필수 필드)와 사이트맵 인덱스·조각(모든 페이지 포함·xhtml:link = 페이지
      #   hreflang·5만 URL/50MB), RSS(language·항목 링크)를 본다. 오류가 있으면 ::error:: 와 함께 실패해 업로드 전에 멈추고,
      #   경고는 주석·잡 요약에만 남긴다.
      - name: Check SEO
        run: npm run --silent seo:check -- out --ci

      # IndexNow 요청 본문 준비(Phase 6-3, 기본 꺼짐 — 저장소 변수 INDEXNOW_ENABLED=1 일 때만, scripts/indexnow.ts).
      #   최신 호의 두 언어 홈·호·기사 URL(out/ 에 있는 것만)을 본문 한 줄 JSON 으로 만들어 잡 출력으로 넘긴다.
      #   실제 전송은 배포가 끝난 뒤 deploy 잡의 "Notify IndexNow" 가 한다. 실패해도 배포는 계속한다.
      - name: Prepare IndexNow payload
        id: indexnow
        if: vars.INDEXNOW_ENABLED == '1'
        continue-on-error: true
        run: |
          npm run --silent indexnow -- out --ci --emit "$RUNNER_TEMP/indexnow.json"
          echo "payload=$(cat "$RUNNER_TEMP/indexnow.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6

      # v4 부터 점(.)으로 시작하는 파일·폴더는 기본으로 빠진다(include-hidden-files: false). out/ 에는 점 파일이 없다
      #   — public/ 에 .well-known 같은 점 파일을 추가하면 include-hidden-files: true 를 켠다.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages 동기화(syncing_files)가 느린 날이 있다 — 2026-11-10 10분 상한에 걸려 취소(평소 12초~5분).
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # IndexNow 알림(Phase 6-3, 기본 꺼짐 — vars.INDEXNOW_ENABLED == '1'). 배포가 끝나 키 파일
      #   (/global-ai-news/<키>.txt)과 새 페이지가 열린 뒤에 build 잡이 만든 본문을 api.indexnow.org 로 보낸다.
      #   200·202 만 성공이고, 그 밖의 응답·네트워크 실패는 ::warning:: 만 남긴다(배포 결과에 영향 없음).
      - name: Notify IndexNow
        if: vars.INDEXNOW_ENABLED == '1' && needs.build.outputs.indexnow != ''
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/indexnow.out" -w '%{http_code}' --max-time 30 \
            -X POST -H 'Content-Type: application/json; charset=utf-8' \
            --data "$PAYLOAD" https://api.indexnow.org/indexnow) || code=000
          body=$(head -c 300 "$RUNNER_TEMP/indexnow.out" 2>/dev/null | tr '\n' ' ')
          count=$(printf '%s' "$PAYLOAD" | grep -o '"https://' | wc -l)
          if [ "$code" = "200" ] || [ "$code" = "202" ]; then
            echo "IndexNow 응답 $code — URL $((count - 1))개 접수 ${body}"
          else
            echo "::warning title=IndexNow::응답 $code(200·202 아님) ${body}"
          fi
