let KR = "b";

const kmark = (s = KR) => `<span class="kb kb-${s}"><span aria-hidden="true">KOREA</span><span class="sr">Korean outlet</span></span>`;
const meter = (v) => `<span class="mt${v >= 4 ? " hi" : ""}" role="img" aria-label="Importance ${v} of 5">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= v ? "on" : ""}"></i>`).join("")}</span>`;
const srcGroup = (a, s = KR) => a.kr ? `<span class="bsrc">${kmark(s)}${s === "b" ? DT : ""}<span class="src">${a.src}</span></span>` : `<span class="src">${a.src}</span>`;

/* data/app.db 1242(AI타임스) ← 1286(The Decoder, follow_up_of=1242) · 같은 분야 기사 1247·1249·1254·1258 */

  { d: "Nov 1", t: "OpenAI raises $11 billion of its $30 billion funding target", s: "OpenAI raised approximately $11 billion in its latest round, falling short of its $30 billion target. The valuation of $1.25 trillion falls below expectations as major investors pull back amid the tech sell-off.", src: "The Decoder", imp: 5 },
  { d: "Nov 1", kr: 1, t: "Sam Altman tells Samsung executives AI adoption speed determines competitiveness", s: "OpenAI CEO Sam Altman met with roughly 50 presidents from Samsung Group affiliates to discuss AI strategy, stressing speed of adoption and execution.", src: "AI Times", imp: 4 },
  { d: "Nov 1", kr: 1, t: "Security vendors pivot to automated response as AI-driven attacks accelerate", s: "The global security market is shifting from threat detection and analysis to real-time blocking and automated response due to AI-accelerated vulnerabilities and attacks.", src: "Electronic Times AI", imp: 3 },

function render() {

        <ol>${THREAD.map((r) => r.cur
          ? `<li class="fu" aria-current="page"><span class="d" title="Oct 31, 2026 issue">${r.d}</span><span class="cur">This story</span></li>`
          : `<li><a class="fu" href="#"><span class="d" title="Nov 2, 2026 issue">${r.d}</span><span><span class="r">${r.rel} · <b>${r.src}</b> · ${r.gap}</span><span class="t hl">${r.t}</span></span></a></li>`).join("")}</ol>

    </article>
    <section class="rel" aria-labelledby="rel-h">
      <div class="rh"><h2 id="rel-h">More in Industry &amp; Policy</h2><a href="#">See all →</a></div>
      ${RELATED.map((r) => `<a class="en" href="#"><span class="en-d">${r.d}</span><span class="en-c"><span class="kk">Industry &amp; Policy</span><h3 class="hl">${r.t}</h3><p>${r.s}</p></span><span class="byl">${srcGroup(r)}${DT}${meter(r.imp)}</span></a>`).join("")}
    </section>
  </main>
  <div class="mbar"><a class="cta" href="#">Read the original${IC.out}</a><span class="cta-n"><b>${a.host}</b> · in Korean</span></div>`;
}

const S = (cap, body, { w = "w400", rec = false } = {}) => `<figure class="spec"><figcaption><b>${cap}</b>${rec ? '<span class="rec">권장</span>' : ""}</figcaption><div class="ed ${w}" lang="en" data-spec>${body}</div></figure>`;
const REL_KO = { src: "Electronic Times AI", ko: "한국딥러닝, IBK기업은행과 VLM 기반 보이스피싱 피해구제 자동화" };
const NOTES = [
  { n: 1, tag: "계획", title: "원제 — “Original article in Korean”",
    body: `<p>한국 매체 기사는 h1 아래 왼쪽 2px 헤어라인 들여 단락에 라벨 <b>Original article in Korean</b> + 한국어 원제(<code>lang="ko"</code>, keep-all, Hahmlet 500 15px 흐림)를 둡니다. 원제는 '읽으라는' 줄이 아니라 '원문이 한국어'라는 증거이자 검색 앵커라 작고 흐리게. 해외 매체는 지금처럼 원제가 영어 제목과 다를 때만 라벨 없이 한 줄(<code>lang="en"</code>).</p><p>정적 HTML 한글 검사(5-4)의 허용 목록은 이 <code>.orig [lang=ko]</code> 하나로 충분합니다.</p>` },
  { n: 2, tag: "제안", title: "원문 발췌는 한국어면 싣지 않는다 · CTA 옆에 언어 안내",
    body: `<p>한국 매체의 <code>content_raw</code>는 한국어라 영어판에서 '원문 발췌' 절 전체를 뺍니다(번역하지 않음). 대신 원문 버튼 옆(모바일은 아래)에 <b>aitimes.com · in Korean</b> — 누르기 전에 한국어 페이지로 간다는 걸 알립니다. 버튼 문구는 사전 그대로 <code>Read the original</code>.</p>` },
  { n: 3, tag: "제안", title: "“Also reported by” — 한국어 제목만 있는 다른 매체 보도",
    body: `<p><code>related_json</code>은 매체명·제목을 수집 원문 그대로 저장해 한국 매체 보도는 한국어 제목입니다(예: 기사 1235의 전자신문). 두 안:</p><ul><li><b>A 원제 그대로</b> — lang=ko, 흐린 세리프. 한글 허용 목록이 하나 더 늘어납니다.</li><li><b>B 제목 대신 안내</b> — 매체 영문명 + “Korean-language report”. 영어 페이지에 한글이 원제 한 곳만 남습니다.</li></ul><p class="ask">권장 B. 매체명은 related_json 의 이름 → sources.name_en 으로 바꿔 찾습니다(지금은 한국어 축약명).</p>`,
    specs: () => S("A 원제 그대로", `<h2 class="sh">Also reported by 1 outlet</h2><a class="cov" href="#"><span class="s">${REL_KO.src}</span><span class="ct ko" lang="ko">${REL_KO.ko}</span></a>`) +
      S("B 제목 대신 안내", `<h2 class="sh">Also reported by 1 outlet</h2><a class="cov" href="#"><span class="s">${REL_KO.src}</span><span class="ct">Korean-language report<small>etnews.com · in Korean</small></span></a>`, { rec: true }) },
  { n: 4, tag: "계획", title: "날짜 칼럼·사건 타임라인",
    body: `<p>날짜 칼럼은 <code>Nov 2</code>(세리프 600 14px, 3.75rem) — 한국어 MM.DD 대신 영어 관례. 툴팁은 <code>Nov 2, 2026 issue</code>. 관계 줄은 사전 그대로 <code>Follow-up · The Decoder · 2 days later</code>, 보고 있는 기사는 <code>This story</code>. 머리는 후속 1건이라 숫자 없이 <code>Follow-up coverage</code>.</p><p>영어 없는 연결 기사는 영어 타임라인에서 뺍니다(계획 5-2).</p>` },
  { n: 5, tag: "제안", title: "매체 영문명 — “Electronic Times AI”",
    body: `<p>sources.name_en 의 <code>Electronic Times AI</code>는 피드 이름(AI 섹션)이라 바이라인에서 길고 어색합니다(360에서 두 줄로 밀림). 매체 자체 영문 표기 <b>ETNews</b>(또는 Electronic Times)를 권장합니다. 축약명 맵에 영문 축약을 두는 방식(SOURCE_SHORT_LABELS 의 en)도 가능합니다.</p>` },
];
function renderNotes() { document.getElementById("notes").innerHTML = NOTES.map((x) => `<article class="note"><div><h3><span class="no">${x.n}</span><span>${x.title}<span class="tag${x.tag === "계획" ? " plan" : ""}">${x.tag}</span></span></h3>${x.body}</div><div class="specs">${x.specs ? x.specs() : ""}</div></article>`).join(""); }

const state = { theme: "light", view: "desktop", kr: "b" };
try { const q = new URLSearchParams(location.search); for (const k of Object.keys(state)) if (q.get(k)) state[k] = q.get(k); if (q.get("bare")) document.body.classList.add("bare"); } catch (e) {}
function apply() {
  KR = state.kr;
  document.body.dataset.view = state.view;
  document.documentElement.dataset.proto = state.theme;
  for (const id of state.view === "desktop" ? ["ed-d"] : ["ed-m1", "ed-m2"]) document.getElementById(id).innerHTML = render();
  renderNotes();
  document.querySelectorAll(".ed").forEach((el) => (el.dataset.theme = state.theme));
  document.querySelectorAll(".seg").forEach((seg) => seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state[seg.dataset.key]))));
  if (state.view === "mobile") requestAnimationFrame(() => { const ph = document.getElementById("ph2"), t = ph.querySelector(".sum"); if (t) ph.scrollTop += t.getBoundingClientRect().top - ph.getBoundingClientRect().top - 110; });
  try { const q = new URLSearchParams(location.search); for (const [k, v] of Object.entries(state)) q.set(k, v); history.replaceState(null, "", "?" + q.toString()); } catch (e) {}
}
document.querySelectorAll(".seg").forEach((seg) => seg.addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (!b) return; state[seg.dataset.key] = b.dataset.v; apply(); }));
apply();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(apply);
</script>
