<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>시안 v3 · 1면 개편</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
/* 로컬 폴백: 저장소의 자체 호스팅 Pretendard(사이트와 같은 파일) */
@font-face {
  font-family: "Pretendard Variable";
  src: url("../../../public/fonts/PretendardVariable.woff2") format("woff2");
  font-weight: 45 920; font-display: swap;
}

/* =====================================================================
   시안 외부(프로토타입 크롬): 툴바·프레임·주석. 디자인 토큰과 무관한 중립 톤.
   ===================================================================== */
* { box-sizing: border-box; }
html { background: #e4e4df; color-scheme: light; }
html[data-proto="dark"] { background: #07080c; color-scheme: dark; }
body { margin: 0; font: 400 14px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #1b1c20; word-break: keep-all; overflow-wrap: anywhere; }
html[data-proto="dark"] body { color: #d9dae0; }

.proto-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px;
  background: #111216; color: #a9abb3; font: 500 12px/1.2 system-ui, sans-serif;
}
.proto-bar .ttl { color: #fff; font-weight: 700; margin-right: 6px; }
.proto-bar .ttl small { color: #8b8e99; font-weight: 500; margin-left: 6px; }
.proto-bar .grp { display: inline-flex; align-items: center; gap: 6px; }
.proto-bar .lbl { opacity: 0.7; }
.seg { display: inline-flex; background: #24262d; border-radius: 99px; padding: 2px; }
.seg button { border: 0; background: transparent; color: #a9abb3; font: inherit; padding: 6px 10px; border-radius: 99px; cursor: pointer; min-height: 28px; }
.seg button:hover { color: #fff; }
.seg button[aria-pressed="true"] { background: #fff; color: #111; }
.proto-bar a { color: #a9abb3; text-decoration: none; margin-left: auto; }
.proto-bar a:hover { color: #fff; }

.proto-stage { padding: 24px 16px 8px; }
.proto-cap { max-width: 1280px; margin: 0 auto 10px; display: flex; gap: 10px; align-items: baseline; font-size: 12px; color: #6d6f78; }
.proto-cap b { color: #1b1c20; font-size: 13px; }
html[data-proto="dark"] .proto-cap b { color: #fff; }
.frame-d { width: min(1280px, 100%); margin: 0 auto; outline: 1px solid rgb(0 0 0 / 0.12); }
.phones { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
.phone-w { display: flex; flex-direction: column; gap: 8px; max-width: 100%; }
.phone-w .proto-cap { margin: 0; }
.phone {
  width: 360px; max-width: 100%; height: 740px; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  outline: 1px solid rgb(0 0 0 / 0.18); border-radius: 18px; scrollbar-width: none;
}
.phone::-webkit-scrollbar { display: none; }
body[data-view="desktop"] .v-mobile, body[data-view="mobile"] .v-desktop { display: none; }

/* 번호 핀(주석 연결용 — 시안 요소 아님) */
.pin {
  position: absolute; z-index: 5; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  background: #d6246e; color: #fff; font: 700 11px/1 system-ui, sans-serif; letter-spacing: 0; pointer-events: none;
  box-shadow: 0 0 0 2px #fff;
}
body[data-pins="0"] .pin { display: none; }
.has-pin { position: relative; }

/* 주석 패널 */
.notes { max-width: 1280px; margin: 40px auto 0; padding: 0 16px 80px; }
.notes > header { border-top: 3px solid #1b1c20; padding-top: 14px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
html[data-proto="dark"] .notes > header { border-color: #d9dae0; }
.notes h2 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
.notes > header p { margin: 0; color: #6d6f78; font-size: 13px; }
.note { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px 28px; padding: 22px 0; border-bottom: 1px solid rgb(0 0 0 / 0.12); }
html[data-proto="dark"] .note { border-color: rgb(255 255 255 / 0.12); }
.note h3 { margin: 0 0 6px; font-size: 15.5px; letter-spacing: -0.015em; display: flex; gap: 8px; align-items: baseline; }
.note h3 .tag { margin-left: 6px; white-space: nowrap; }
.note h3 .no { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #d6246e; color: #fff; font-size: 12px; transform: translateY(-1px); }
.note h3 .tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: #fde7f0; color: #a3164f; }
.note h3 .tag.plan { background: #e7e9f0; color: #3d4252; }
html[data-proto="dark"] .note h3 .tag { background: #3a1626; color: #ff9cc4; }
html[data-proto="dark"] .note h3 .tag.plan { background: #23262f; color: #b5b9c6; }
.note p, .note li { margin: 0; color: #43464f; font-size: 13.5px; }
html[data-proto="dark"] .note p, html[data-proto="dark"] .note li { color: #b6b8c1; }
.note ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.note .ask { margin-top: 8px; font-weight: 600; color: #1b1c20; }
html[data-proto="dark"] .note .ask { color: #fff; }
.specs { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; min-width: 0; }
.spec { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 100%; }
.spec figcaption { font-size: 12px; color: #6d6f78; display: flex; gap: 6px; align-items: baseline; }
.spec figcaption b { color: #1b1c20; font-size: 12.5px; }
html[data-proto="dark"] .spec figcaption b { color: #fff; }
.spec figcaption .rec { color: #a3164f; font-weight: 700; }
html[data-proto="dark"] .spec figcaption .rec { color: #ff9cc4; }
.spec .ed { outline: 1px solid rgb(0 0 0 / 0.1); padding: 14px 16px; }
.w328 { width: 328px; max-width: 100%; }
.w360 { width: 360px; max-width: 100%; }
.w560 { width: 560px; max-width: 100%; }
.w720 { width: 720px; max-width: 100%; }
.w840 { width: 840px; max-width: 100%; }
.dgr { border-collapse: collapse; font-size: 13px; width: 100%; }
.dgr th, .dgr td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border); vertical-align: baseline; }
.dgr th { font-size: 12px; color: var(--muted-foreground); font-weight: 600; }
@media (max-width: 860px) { .note { grid-template-columns: 1fr; } }

body.bare .proto-bar, body.bare .proto-cap, body.bare .notes, body.bare .v-mobile { display: none !important; }
body.bare .proto-stage { padding: 0; }
body.bare .frame-d { width: 100%; outline: 0; }

/* =====================================================================
   시안(디자인) — src/app/globals.css 토큰 값을 그대로 옮김. .ed 가 컨테이너 쿼리 기준.
   반응형은 뷰포트가 아니라 프레임 폭 기준(@container) — md 768 / lg 1024 피벗은 사이트와 동일.
   ===================================================================== */
.ed {
  --background: #f4f4f1; --foreground: #141519; --foreground-soft: #3a3c43; --card: #fbfbf9;
  --muted: #eaeae5; --muted-foreground: #66686f; --brand: #2140e8; --brand-soft: rgb(33 64 232 / 0.08);
  --border: #d8d8d2; --input: #c9c9c2; --rule: #141519; --ring: #2140e8;
  --serif: "Hahmlet", "Noto Serif KR", AppleMyungjo, Batang, serif;
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  container-type: inline-size;
  background: var(--background); color: var(--foreground);
  font: 400 16px/1.5 var(--sans); letter-spacing: -0.01em;
  word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; text-align: left;
}
.ed[data-theme="dark"] {
  --background: #0f1118; --foreground: #eceae4; --foreground-soft: #bcbbb5; --card: #151823;
  --muted: #1c1f2b; --muted-foreground: #8d8f9a; --brand: #93a3ff; --brand-soft: rgb(147 163 255 / 0.1);
  --border: #2a2d39; --input: #3a3e4d; --rule: #eceae4; --ring: #93a3ff;
  color-scheme: dark;
}
.ed *, .ed *::before, .ed *::after { box-sizing: border-box; }
.ed a { color: inherit; text-decoration: none; }
.ed h1, .ed h2, .ed h3, .ed p, .ed ol, .ed ul { margin: 0; padding: 0; }
.ed ol, .ed ul { list-style: none; }
.ed h1, .ed h2, .ed h3 { text-wrap: balance; }
.ed button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.ed :focus-visible { outline: 2px solid var(--ring); outline-offset: 4px; }
.ed .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ed .hl { transition: color 0.15s ease-out; }
.ed a:hover .hl { color: var(--brand); }
.ed .num { font-variant-numeric: tabular-nums; }
.ed .wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }
.ed .d-only { display: none; }
.ed .lg-only { display: none; }
.ed svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ── 신호 프리미티브 ── */
.ed .kk { font-size: 13px; line-height: 1.4; font-weight: 700; color: var(--brand); letter-spacing: 0.02em; white-space: nowrap; }
.ed .byl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; line-height: 1.4; color: var(--muted-foreground); }
.ed .byl .src { color: var(--foreground-soft); font-weight: 600; }
.ed .byl .bsrc { display: inline-flex; align-items: center; gap: 7px; }
.ed .byl .oth { color: var(--muted-foreground); font-weight: 400; }
.ed .dt { width: 2px; height: 2px; border-radius: 50%; background: currentColor; flex: none; }
.ed .mt { display: inline-flex; align-items: center; gap: 3px; }
.ed .mt i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--muted-foreground) 70%, transparent); }
.ed .mt i.on { background: var(--foreground); border-color: var(--foreground); }
.ed .mt.hi i.on { background: var(--brand); border-color: var(--brand); }
/* FormatBadge — 잉크 1px 아웃라인, 각진 면, 코발트 없음 */
.ed .fb {
  position: relative; display: inline-flex; align-items: center; flex: none; height: 17px; padding: 1px 5px 0;
  border: 1px solid var(--foreground); color: var(--foreground);
  font: 700 10.5px/1 var(--sans); letter-spacing: 0.09em; white-space: nowrap;
}
.ed .bar { position: relative; display: block; height: 2px; flex: 1; background: var(--border); overflow: hidden; }
.ed .bar > span { position: absolute; inset: 0 auto 0 0; background: var(--brand); }
.ed .si-st svg, .ed .rm svg { width: 11px; height: 11px; flex: none; fill: currentColor; stroke: none; transform: translateY(0.5px); }

/* ── 전역 헤더(데스크톱) / 모바일 상단 바 ── */
.ed .hdr { display: none; position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--background) 85%, transparent); backdrop-filter: blur(12px); }
.ed .hdr .wrap { height: 52px; display: flex; align-items: center; gap: 32px; }
.ed .wm { font: 800 22px/1 var(--serif); letter-spacing: -0.045em; visibility: hidden; }
.ed .wm em { font-style: normal; color: var(--brand); }
.ed .hnav { margin-left: auto; display: flex; align-items: center; gap: 22px; font-size: 14px; font-weight: 600; }
.ed .hnav a { color: var(--muted-foreground); padding: 4px 0; }
.ed .hnav a.on { color: var(--foreground); text-decoration: underline; text-decoration-color: var(--brand); text-decoration-thickness: 2px; text-underline-offset: 18px; }
.ed .ibtn { display: inline-grid; place-items: center; width: 40px; height: 40px; color: var(--foreground-soft); }
.ed .mtop { position: sticky; top: 0; z-index: 20; height: 52px; display: flex; align-items: center; justify-content: space-between; padding-inline: 16px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--background) 85%, transparent); backdrop-filter: blur(12px); }
.ed .mtop .ibtns { display: flex; margin-right: -10px; }
.ed .mtop .ibtn { width: 44px; height: 44px; }
.ed .tabbar { position: sticky; bottom: 0; z-index: 20; display: flex; border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--background) 90%, transparent); backdrop-filter: blur(12px); }
.ed .tabbar a { position: relative; flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: var(--muted-foreground); }
.ed .tabbar a.on { color: var(--foreground); font-weight: 600; }
.ed .tabbar a.on::before { content: ""; position: absolute; top: 0; width: 32px; height: 2px; background: var(--brand); }

/* ── 마스트헤드 ── */
.ed .mast { padding-top: 20px; }
.ed .folio { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 13px; line-height: 1.4; color: var(--muted-foreground); }
.ed .folio .fdate { color: var(--foreground); font-weight: 600; }
.ed .folio .push { margin-left: auto; }
.ed .share { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-block: -12px; font-size: 13px; font-weight: 600; color: var(--foreground-soft); }
.ed .share svg { width: 14px; height: 14px; }
.ed .delay { margin-top: 12px; padding-block: 8px; border-block: 1px solid var(--border); font-size: 14px; line-height: 1.55; color: var(--foreground-soft); display: flex; gap: 10px; align-items: baseline; }
.ed .delay .dl-l { flex: none; font-size: 13px; font-weight: 700; color: var(--brand); letter-spacing: 0.02em; }
.ed .delay b { color: var(--foreground); font-weight: 600; }
.ed .delay .dl-r { margin-left: auto; font-size: 13px; color: var(--muted-foreground); white-space: nowrap; }
.ed .npr { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.ed .np { font: 800 clamp(48px, 8.4cqi, 120px)/0.95 var(--serif); letter-spacing: -0.045em; white-space: nowrap; }
.ed .np em { font-style: normal; color: var(--brand); }
.ed .ear { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; font-size: 13px; line-height: 1.4; color: var(--muted-foreground); }
.ed .ear .ear-l { font-weight: 700; color: var(--foreground); letter-spacing: 0.02em; }
.ed .ear .ear-n b { font-weight: 700; color: var(--foreground); }
.ed .ear .ear-f { display: inline-flex; flex-wrap: wrap; gap: 0 4px; }
.ed .ear .ear-f b { font-weight: 600; color: var(--foreground-soft); font-variant-numeric: tabular-nums; }
.ed .ear .ear-f i { font-style: normal; opacity: 0.6; }
.ed .tagline { font-size: 14px; line-height: 1.55; color: var(--muted-foreground); max-width: 17em; }
.ed .rules { margin-top: 16px; height: 6px; border-top: 4px solid var(--rule); border-bottom: 1px solid var(--rule); }
.ed .snav { display: flex; gap: 4px; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
.ed .snav::-webkit-scrollbar { display: none; }
.ed .snav a { flex: none; padding: 12px 10px; font-size: 14px; line-height: 1.55; font-weight: 500; color: var(--foreground-soft); white-space: nowrap; }
.ed .snav a:first-child { padding-left: 0; color: var(--foreground); text-decoration: underline; text-decoration-color: var(--brand); text-decoration-thickness: 2px; text-underline-offset: 14px; }

/* ── 1면 ── */
.ed .front { display: grid; grid-template-columns: minmax(0, 1fr); padding-top: 24px; }
.ed .lead { display: flex; flex-direction: column; gap: 16px; padding-bottom: 28px; border-bottom: 1px solid var(--border); }
.ed .lead h2 { font: 700 clamp(34px, 4.6cqi, 60px)/1.14 var(--serif); letter-spacing: -0.045em; }
.ed .lead p { font-size: 17px; line-height: 1.7; color: var(--foreground-soft); max-width: 40em; }
.ed .secs { display: grid; grid-template-columns: minmax(0, 1fr); }
.ed .sec { display: flex; flex-direction: column; gap: 10px; padding-block: 20px; border-bottom: 1px solid var(--border); }
.ed .sec h3 { font: 700 21px/1.38 var(--serif); letter-spacing: -0.035em; }
.ed .sec p { font-size: 14px; line-height: 1.55; color: var(--muted-foreground); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ed .sec .byl { margin-top: auto; padding-top: 2px; }

/* 오늘의 브리핑 — 모바일 기본: 제목(2줄) → 병합 메타 줄 */
.ed .briefs { padding-top: 16px; }
.ed .bh { display: flex; align-items: baseline; gap: 10px; padding-bottom: 4px; }
.ed .bh h2 { font-size: 13px; line-height: 1.4; font-weight: 700; letter-spacing: 0.02em; }
.ed .bh span { font-size: 12px; color: var(--muted-foreground); }
.ed .briefs li + li { border-top: 1px solid var(--border); }
.ed .brief { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; padding-block: 10px; min-height: 44px; }
.ed .brief > .kk { display: none; }
.ed .brief h3 { font: 700 15px/1.4 var(--serif); letter-spacing: -0.03em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ed .brief .byl { flex-wrap: nowrap; white-space: nowrap; gap: 4px 8px; min-width: 0; }
.ed .brief .byl .kk { overflow: hidden; text-overflow: ellipsis; }
.ed .brief.vB .byl { order: -1; }
/* 현재 구현 재현(비교용): 키커 / 제목 2줄 / 바이라인 3단 + 상속 크기 버그 */
.ed .brief.cur { gap: 4px; padding-block: 14px; }
.ed .brief.cur > .kk { display: block; font-size: 16px; line-height: 1.5; }
.ed .brief.cur h3 { font-size: 16px; line-height: 1.5; }
.ed .brief.cur .byl { font-size: 16px; line-height: 1.5; }
.ed .brief.cur .byl .mkk, .ed .brief.cur .byl .mkd { display: none; }

/* 지금 화제 */
.ed .hot { margin-top: 40px; min-width: 0; }
.ed .hot-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--rule); }
.ed .hot-h h2 { font: 800 24px/1.2 var(--serif); letter-spacing: -0.04em; }
.ed .hot-h span { font-size: 12px; line-height: 1.3; color: var(--muted-foreground); }
.ed .tr { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px 8px; padding-block: 14px; border-bottom: 1px solid var(--border); }
.ed .tr .rn { grid-row: span 2; font: 500 30px/1 var(--serif); letter-spacing: -0.04em; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.ed .tr .rn.top { font-weight: 700; color: var(--brand); }
.ed .tr .hl { font-size: 15px; line-height: 1.45; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ed .tr .ts { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 1.3; color: var(--muted-foreground); }
.ed .tr .ts .src { flex: none; }
.ed .tr .ts b { color: var(--foreground-soft); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }

/* (제안) 이 호의 지면 — 데스크톱 사이드바 */
.ed .inside { margin-top: 36px; }
.ed .inside-h { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 8px; border-bottom: 2px solid var(--rule); }
.ed .inside-h h2 { font: 800 20px/1.2 var(--serif); letter-spacing: -0.04em; }
.ed .inside-h span { font-size: 12px; color: var(--muted-foreground); }
.ed .inside a { display: flex; align-items: baseline; gap: 8px; padding-block: 9px; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.4; }
.ed .inside a .nm { font-weight: 600; }
.ed .inside a .ld { flex: 1; align-self: center; border-bottom: 1px dotted var(--input); transform: translateY(3px); }
.ed .inside a .n { font-weight: 600; font-variant-numeric: tabular-nums; }
.ed .inside a .f { width: 4.2em; text-align: right; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.ed .inside a:hover .nm { color: var(--brand); }

/* 오픈소스·논문 레이더 */
.ed .band { margin-top: 48px; min-width: 0; }
.ed .band-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding-top: 12px; margin-bottom: 20px; border-top: 2px solid var(--rule); }
.ed .band-h h2 { font: 800 clamp(26px, 2.6cqi, 30px)/1.2 var(--serif); letter-spacing: -0.045em; white-space: nowrap; }

const pin = (n, cls = "", style = "") => `<i class="pin ${cls}" style="${style}" aria-hidden="true">${n}</i>`;
const fmtNum = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e4 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k" : n.toLocaleString("en-US");
const fmtParams = (n) => n >= 1e9 ? (n >= 1e10 ? Math.round(n / 1e9) : (n / 1e9).toFixed(1).replace(/\.0$/, "")) + "B" : Math.round(n / 1e6) + "M";

const meter = (v) => `<span class="mt${v >= 4 ? " hi" : ""}" role="img" aria-label="중요도 ${v}/5">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= v ? "on" : ""}"></i>`).join("")}</span>`;
const DT = '<span class="dt" aria-hidden="true"></span>';
const src = (a) => `<span class="src">${a.src}${a.rel ? `<span class="oth"> 외 ${a.rel}곳</span>` : ""}</span>`;

function byline(a, { trend = false, cmp = false, when = true, fb = false } = {}) {
  const parts = [];
  parts.push(fb && FB[a.fmt] ? `<span class="bsrc">${badge(a.fmt)}${src(a)}</span>` : src(a));
  const tail = [];
  if (when && a.when) tail.push(`<span class="num">${a.when}</span>`);
  if (a.imp) tail.push(meter(a.imp));
  if (trend && a.tr) tail.push(`<span class="num">화제 ${a.tr}</span>`);
  if (cmp) return `<span class="byl cmp">${parts.join("")}<span class="dt x"></span><span style="display:inline-flex;align-items:center;gap:10px">${tail.join("")}</span></span>`;
  return `<span class="byl">${[...parts, ...tail].join(DT)}</span>`;
}

function radarMeta(a, { delta = "today" } = {}) {
  const e = a.eng || {};
  let id = "", st = [];
  if (a.fmt === "oss") {
    id = a.id || "";
    if (e.stars != null) st.push(`<span>${IC.star}<b>${fmtNum(e.stars)}</b></span>`);
    if (e.stars_today) st.push(delta === "paren" ? `<span>(+${e.stars_today.toLocaleString("en-US")})</span>` : `<span>오늘 <b>+${e.stars_today.toLocaleString("en-US")}</b></span>`);
    if (e.language) st.push(`<span>${e.language}</span>`);
  } else if (a.fmt === "model") {
    id = a.id || "";
    if (e.params) st.push(`<span><b>${fmtParams(e.params)}</b></span>`);
    if (e.pipeline_tag) st.push(`<span>${e.pipeline_tag}</span>`);
    if (e.likes != null) st.push(`<span>${IC.heart}<b>${fmtNum(e.likes)}</b></span>`);
    if (e.downloads != null) st.push(`<span>${IC.down}<b>${fmtNum(e.downloads)}</b></span>`);
  } else if (a.fmt === "paper") {
    id = a.id ? `arXiv ${a.id}` : "";
    if (e.ups) st.push(`<span>${IC.up}<b>${fmtNum(e.ups)}</b></span>`);
    if (e.citations) st.push(`<span>인용 <b>${fmtNum(e.citations)}</b></span>`);
  }
  if (!id && !st.length) id = a.src;
  const label = [id, ...st.map((s) => s.replace(/<[^>]+>/g, ""))].join(" · ");
  return `<span class="rm" aria-label="${label}">${id ? `<span class="rm-id">${id}</span>` : ""}${st.length ? `<span class="rm-st">${st.join("")}</span>` : ""}</span>`;
}

function radarCard(a, { kickerOn = true, delta = "today", pins = false, i = 0 } = {}) {
  return `<a class="rc" href="#"><span class="rc-top${pins && i === 0 ? " has-pin" : ""}">${badge(a.fmt)}${kickerOn ? kicker(a.cat) : ""}${pins && i === 0 ? pin(8, "", "left:-10px;top:-12px") : ""}</span><h3 class="hl">${a.t}</h3><p>${a.s}</p><span class="${pins && (i === 0 || i === 3) ? "has-pin" : ""}" style="margin-top:auto;display:block">${radarMeta(a, { delta })}${pins && i === 0 ? pin(9, "", "right:-6px;top:0") : ""}${pins && i === 3 ? pin(10, "", "right:-6px;top:0") : ""}</span></a>`;
}

function briefRow(a, variant = "") {

}

function trendRow(a, i) {

    body: `<p><code>cn()</code>(twMerge)이 <code>text-meta</code>를 색 클래스로 오인해 지웁니다. 그래서 키커·바이라인이 13px이 아니라 <b>상속 크기 16px</b>로 그려지고, 색인 키커는 코발트가 빠져 잉크색입니다. <code>extendTailwindMerge</code>에 크기 토큰을 등록해 고치면 리드·서브·브리핑·섹션·색인·상세·검색의 키커와 바이라인이 <b>16 → 13px</b>로 작아집니다. 이 시안은 수정 후 크기로 그렸습니다.</p><p class="ask">상단 툴바 <b>키커·바이라인: 현재(버그)</b>로 전체 화면을 비교할 수 있습니다. 수정에 동의하면 그대로 진행합니다.</p>`,
    specs: () => S("현재 (16px 상속)", `<div style="display:flex;flex-direction:column;gap:8px">${kicker("industry")}<span style="font:700 22px/1.25 var(--serif);letter-spacing:-0.04em">${LEAD.t}</span>${byline(LEAD)}<div style="margin-top:6px">${entryRow(INDEX[3]).replace('class="en"', 'class="en" style="border-bottom:0;padding-block:0"')}</div></div>`, { w: "w360", cls: "bug" }) + S("수정 후 (13px · 색인 12px 코발트)", `<div style="display:flex;flex-direction:column;gap:8px">${kicker("industry")}<span style="font:700 22px/1.25 var(--serif);letter-spacing:-0.04em">${LEAD.t}</span>${byline(LEAD)}<div style="margin-top:6px">${entryRow(INDEX[3]).replace('class="en"', 'class="en" style="border-bottom:0;padding-block:0"')}</div></div>`, { w: "w360", rec: true }) },
];

function renderNotes() {
  document.getElementById("notes").innerHTML = NOTES.map((x) => `<article class="note" id="n${x.n}"><div><h3><span class="no">${x.n}</span><span>${x.title}<span class="tag${x.tag === "계획" ? " plan" : ""}">${x.tag}</span></span></h3>${x.body}</div><div class="specs">${x.specs ? x.specs() : ""}</div></article>`).join("");
}

/* =====================================================================
   상태·툴바
   ===================================================================== */
const state = { theme: "light", view: "desktop", delay: "0", bug: "0", pins: "1" };
try {
  const q = new URLSearchParams(location.search);
  for (const k of Object.keys(state)) if (q.get(k)) state[k] = q.get(k);
  if (q.get("bare")) { document.body.classList.add("bare"); state.pins = "0"; }
} catch (e) {}

function apply() {
  const delayed = state.delay === "1";
  const pinsOn = state.pins === "1";
  document.body.dataset.view = state.view;
  document.body.dataset.pins = state.pins;
  document.documentElement.dataset.proto = state.theme;
  const targets = state.view === "desktop" ? ["ed-d"] : ["ed-m1", "ed-m2", "ed-m3"];
  for (const id of targets) {
    const el = document.getElementById(id);
    el.innerHTML = renderEdition({ delayed, pins: pinsOn, mobile: id !== "ed-d" });
  }
  document.querySelectorAll(".ed").forEach((el) => {
    el.dataset.theme = state.theme;
    if (!el.hasAttribute("data-spec")) el.classList.toggle("bug", state.bug === "1");
  });
  document.querySelectorAll(".seg").forEach((seg) => {
    seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state[seg.dataset.key])));
  });
  if (state.view === "mobile") {
    requestAnimationFrame(() => {
      for (const [pid, sel] of [["ph2", ".briefs"], ["ph3", ".rlist"]]) {
        const ph = document.getElementById(pid);
        const target = ph.querySelector(sel);
        if (target) ph.scrollTop += target.getBoundingClientRect().top - ph.getBoundingClientRect().top - (sel === ".rlist" ? 150 : 68);
      }
    });
  }
  // 측정값 캡션
  requestAnimationFrame(() => {
    document.querySelectorAll(".spec .measure, .spec .ed.measure").forEach((ed) => {
      const row = ed.querySelector(".brief");
      const h = ed.parentElement.querySelector("figcaption .h");
      if (row && h) h.textContent = `행 높이 ${Math.round(row.getBoundingClientRect().height)}px`;
    });
  });
  try {
    const q = new URLSearchParams(location.search);
    for (const [k, v] of Object.entries(state)) q.set(k, v);
    history.replaceState(null, "", "?" + q.toString());
  } catch (e) {}
}

document.querySelectorAll(".seg").forEach((seg) => {
  seg.addEventListener("click", (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    state[seg.dataset.key] = b.dataset.v;
    apply();
  });
});

renderNotes();
apply();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(apply);
</script>
</body>
</html>
