# 정적 export(out/) 서빙 — GitHub Pages 프로젝트 페이지 동작을 따른다.
#   - 사이트는 basePath 와 같은 /global-ai-news/ 아래에 있다(next.config.ts BASE_PATH).
#   - trailingSlash:true 산출(article/<id>/index.html)이라 슬래시 없는 디렉터리 경로는 301로 슬래시를 붙인다.
#   - 없는 경로는 404 상태로 out/404.html 을 보여 준다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 포트 매핑(8080:8080 외)에서도 Location 이 깨지지 않게 상대 경로로 리다이렉트한다.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # 루트(GitHub Pages 에선 사용자 사이트 자리) → 이 사이트로 보낸다.
    location = / {
        return 302 /global-ai-news/;
    }

    location = /global-ai-news {
        return 301 /global-ai-news/;
    }

    location /global-ai-news/ {
        # GitHub Pages 기본값과 같은 짧은 캐시(HTML·search-index.json·latest.json·OG 이미지는 매일 바뀐다).
        add_header Cache-Control "public, max-age=600" always;
        try_files $uri $uri/ =404;
    }

    # 해시가 붙은 빌드 산출물 — 내용이 바뀌면 파일명이 바뀌므로 오래 캐시한다.
    location /global-ai-news/_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    error_page 404 /global-ai-news/404.html;
    location = /global-ai-news/404.html {
        add_header Cache-Control "no-cache" always;
    }
}
